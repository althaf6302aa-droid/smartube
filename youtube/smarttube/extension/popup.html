<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTube Settings</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #181b24;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #8b5cf6;
      --accent-grad: linear-gradient(135deg, #ec4899, #8b5cf6);
      --border: rgba(255, 255, 255, 0.1);
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .logo-icon {
      font-size: 22px;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .tagline {
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .dot.disconnected {
      background: var(--error);
      box-shadow: 0 0 8px var(--error);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: #11131a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 9px;
      background: var(--accent-grad);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    .toast {
      display: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
    }

    .toast.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo-icon">✨</span>
    <div>
      <h1>SmartTube</h1>
      <p class="tagline">Intelligent Re-Ranker</p>
    </div>
  </div>

  <div class="status-card">
    <span style="font-size: 12px; color: var(--text-muted);">Backend Server:</span>
    <div class="status-indicator">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="form-group">
    <label for="backendUrl">FastAPI Endpoint</label>
    <input type="text" id="backendUrl" placeholder="http://127.0.0.1:8000/rank" />
  </div>

  <div class="form-group">
    <label for="apiKey">YouTube Data API Key (Optional)</label>
    <input type="password" id="apiKey" placeholder="Leave empty for DOM-only mode" />
  </div>

  <button class="btn" id="saveBtn">Save Settings</button>
  <div id="toast" class="toast"></div>

  <div class="footer">
    Go to any YouTube search page and click "✨ Analyze & Re-rank"
  </div>

  <script src="popup.js"></script>
</body>
</html>
